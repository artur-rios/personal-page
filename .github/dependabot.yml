version: 2

# Dependency update pull requests. Every pull request targets develop: main only receives release/*
# pull requests (CONTRIBUTING.md), and the branch-policy workflow accepts dependabot/* heads into
# develop.

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates land together; major updates get a pull request each.
      npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
